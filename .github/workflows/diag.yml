name: diag
on: workflow_dispatch
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-core python3-opencv
      - run: node --version && ffmpeg -version | head -1 && python3 -c "import cv2;print(cv2.__version__)"
      - run: |
          (while true; do sleep 45; echo "--- ps $(date +%T)"; ps -eo pid,etimes,pcpu,args --sort=-pcpu | head -8 | cut -c1-170; done) &
          timeout 560 node --test --test-reporter=spec test/logfix.test.ts 2>&1 | grep -E '✔|✖|ℹ|---|PID|node|ffmpeg|python' | cut -c1-200 | tail -90
