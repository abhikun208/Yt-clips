# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create data --size 10`, `fly secrets set YT_CLIPS_TOKEN=<12+ chars>`, `fly deploy`
app = "yt-clips"
primary_region = "sin"
[build]
  dockerfile = "Dockerfile"
[env]
  YT_CLIPS_DATA_DIR = "/data"
[mounts]
  source = "data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
